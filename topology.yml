---
# ============================================================================
# NetWatch Topology Definition
# ============================================================================
# This file is the SINGLE SOURCE OF TRUTH for the entire fabric.
# The config generator reads this to produce all FRR, Prometheus, DHCP,
# DNS, and provisioning configurations.
#
# Change this file, regenerate, get a different fabric.
# Never hand-edit generated configs.
# ============================================================================

project:
  name: netwatch
  version: "1.0"
  description: >
    31-VM data-center lab emulator built around a
    12-switch 3-tier L3 Clos routing fabric. All VMs, no Docker.

# ============================================================================
# CONTROL-PLANE TIMERS
# ============================================================================
# All control-plane timers are 10x dilated to eliminate false BFD flaps
# from CPU scheduling jitter on shared laptop hardware.
# Behavioral state machines are identical to production.
# Data-plane metrics are untouched.

timers:
  dilation_factor: 10

  bfd:
    tx_interval_ms: 1000        # production equivalent: 100 ms
    rx_interval_ms: 1000        # production equivalent: 100 ms
    detect_multiplier: 3        # detection time: 3 s (prod: 300 ms)

  bgp:
    keepalive_s: 30             # production equivalent: 3 s
    holdtime_s: 90              # production equivalent: 9 s

# ============================================================================
# ASN ASSIGNMENTS
# ============================================================================
# 6-ASN model. eBGP everywhere, no iBGP.
# ASN-per-rack maps directly to failure domains.

asn:
  border: 65000
  spine: 65001
  racks:
    rack-1: 65101
    rack-2: 65102
    rack-3: 65103
    rack-4: 65104

# ============================================================================
# ADDRESS SPACE
# ============================================================================
# Three non-overlapping address families, each with a distinct purpose.
#
#   10.0.0.0/16      Loopbacks   - router-ID, SSH target, scrape target
#   172.16.0.0/16    Fabric P2P  - /30 subnets, one per link
#   192.168.0.0/24   Management  - OOB, isolated from routed fabric

addressing:
  loopback:
    cidr: "10.0.0.0/16"
    description: >
      Advertised into BGP. Used as router-ID and scrape target.
      10.0.1.x = border, 10.0.2.x = spine, 10.0.3.x = leaf,
      10.0.4.x = rack-1 servers, 10.0.5.x = rack-2 servers,
      10.0.6.x = rack-3 servers, 10.0.7.x = rack-4 servers.

  fabric:
    cidr: "172.16.0.0/16"
    description: "Point-to-point /30 subnets. Connected routes only."
    pools:
      border_bastion: "172.16.0.0/24"
      border_spine: "172.16.1.0/24"
      spine_leaf: "172.16.2.0/24"
      leaf_server_rack1: "172.16.3.0/24"
      leaf_server_rack2: "172.16.4.0/24"
      leaf_server_rack3: "172.16.5.0/24"
      leaf_server_rack4: "172.16.6.0/24"

  management:
    cidr: "192.168.0.0/24"
    gateway: "192.168.0.1"
    description: >
      OOB management on the libvirt-managed 'netwatch-mgmt' network.
      Isolated from the routed fabric. DHCP is served by libvirt;
      DNS (netwatch.lab) is served by dnsmasq on the obs node (192.168.0.4).

# ============================================================================
# NODES
# ============================================================================
# 31 total: 12 FRR VMs + 16 server VMs + 1 bastion VM + 1 obs VM + 1 mgmt VM
# All VMs use the netwatch-golden box (Fedora Cloud + FRR 10.5.0). No Docker.
# obs (192.168.0.4) runs the full observability + DNS/NTP stack.
# mgmt (192.168.0.3) is a reserved stub (base+client only, no services).
#
# Convention:
#   - FRR VMs: Fedora, 256 MB, FRR enabled at provision time, fabric NICs hot-plugged
#   - Server VMs: Fedora Cloud, KVM/Vagrant, KSM memory deduplication
#   - IP assignment: .1 = higher-tier endpoint, .2 = lower-tier endpoint

nodes:

  # --- Border routers (AS 65000) -------------------------------------------
  borders:
    - name: border-1
      type: frr-vm
      role: border
      asn: 65000
      vcpu: 1
      memory_mb: 256
      loopback: "10.0.1.1/32"
      mgmt_ip: "192.168.0.10"
      metrics_port: 9342          # frr_exporter

    - name: border-2
      type: frr-vm
      role: border
      asn: 65000
      vcpu: 1
      memory_mb: 256
      loopback: "10.0.1.2/32"
      mgmt_ip: "192.168.0.11"
      metrics_port: 9342

  # --- Spine switches (AS 65001) -------------------------------------------
  spines:
    - name: spine-1
      type: frr-vm
      role: spine
      asn: 65001
      vcpu: 1
      memory_mb: 256
      loopback: "10.0.2.1/32"
      mgmt_ip: "192.168.0.20"
      metrics_port: 9342

    - name: spine-2
      type: frr-vm
      role: spine
      asn: 65001
      vcpu: 1
      memory_mb: 256
      loopback: "10.0.2.2/32"
      mgmt_ip: "192.168.0.21"
      metrics_port: 9342

  # --- Leaf switches (ASN per rack) ----------------------------------------
  leafs:
    # Rack 1 - AS 65101
    - name: leaf-1a
      type: frr-vm
      role: leaf
      rack: rack-1
      asn: 65101
      vcpu: 1
      memory_mb: 256
      loopback: "10.0.3.1/32"
      mgmt_ip: "192.168.0.30"
      metrics_port: 9342
      evpn_vtep: true

    - name: leaf-1b
      type: frr-vm
      role: leaf
      rack: rack-1
      asn: 65101
      vcpu: 1
      memory_mb: 256
      loopback: "10.0.3.2/32"
      mgmt_ip: "192.168.0.31"
      metrics_port: 9342
      evpn_vtep: true

    # Rack 2 - AS 65102
    - name: leaf-2a
      type: frr-vm
      role: leaf
      rack: rack-2
      asn: 65102
      vcpu: 1
      memory_mb: 256
      loopback: "10.0.3.3/32"
      mgmt_ip: "192.168.0.32"
      metrics_port: 9342
      evpn_vtep: true

    - name: leaf-2b
      type: frr-vm
      role: leaf
      rack: rack-2
      asn: 65102
      vcpu: 1
      memory_mb: 256
      loopback: "10.0.3.4/32"
      mgmt_ip: "192.168.0.33"
      metrics_port: 9342
      evpn_vtep: true

    # Rack 3 - AS 65103
    - name: leaf-3a
      type: frr-vm
      role: leaf
      rack: rack-3
      asn: 65103
      vcpu: 1
      memory_mb: 256
      loopback: "10.0.3.5/32"
      mgmt_ip: "192.168.0.34"
      metrics_port: 9342
      evpn_vtep: true

    - name: leaf-3b
      type: frr-vm
      role: leaf
      rack: rack-3
      asn: 65103
      vcpu: 1
      memory_mb: 256
      loopback: "10.0.3.6/32"
      mgmt_ip: "192.168.0.35"
      metrics_port: 9342
      evpn_vtep: true

    # Rack 4 - AS 65104
    - name: leaf-4a
      type: frr-vm
      role: leaf
      rack: rack-4
      asn: 65104
      vcpu: 1
      memory_mb: 256
      loopback: "10.0.3.7/32"
      mgmt_ip: "192.168.0.36"
      metrics_port: 9342
      evpn_vtep: true

    - name: leaf-4b
      type: frr-vm
      role: leaf
      rack: rack-4
      asn: 65104
      vcpu: 1
      memory_mb: 256
      loopback: "10.0.3.8/32"
      mgmt_ip: "192.168.0.37"
      metrics_port: 9342
      evpn_vtep: true

  # --- Compute servers (Fedora KVM VMs) ------------------------------------
  # 4 racks x 4 servers per rack = 16 servers
  # Each server is dual-homed to both leafs in its rack.
  servers:
    # Rack 1
    - name: srv-1-1
      type: fedora-vm
      role: server
      rack: rack-1
      vcpu: 1
      memory_mb: 768
      loopback: "10.0.4.1/32"
      mgmt_ip: "192.168.0.50"
      metrics_port: 9100          # node_exporter

    - name: srv-1-2
      type: fedora-vm
      role: server
      rack: rack-1
      vcpu: 1
      memory_mb: 768
      loopback: "10.0.4.2/32"
      mgmt_ip: "192.168.0.51"
      metrics_port: 9100

    - name: srv-1-3
      type: fedora-vm
      role: server
      rack: rack-1
      vcpu: 1
      memory_mb: 768
      loopback: "10.0.4.3/32"
      mgmt_ip: "192.168.0.52"
      metrics_port: 9100

    - name: srv-1-4
      type: fedora-vm
      role: server
      rack: rack-1
      vcpu: 1
      memory_mb: 768
      loopback: "10.0.4.4/32"
      mgmt_ip: "192.168.0.53"
      metrics_port: 9100

    # Rack 2
    - name: srv-2-1
      type: fedora-vm
      role: server
      rack: rack-2
      vcpu: 1
      memory_mb: 768
      loopback: "10.0.5.1/32"
      mgmt_ip: "192.168.0.54"
      metrics_port: 9100

    - name: srv-2-2
      type: fedora-vm
      role: server
      rack: rack-2
      vcpu: 1
      memory_mb: 768
      loopback: "10.0.5.2/32"
      mgmt_ip: "192.168.0.55"
      metrics_port: 9100

    - name: srv-2-3
      type: fedora-vm
      role: server
      rack: rack-2
      vcpu: 1
      memory_mb: 768
      loopback: "10.0.5.3/32"
      mgmt_ip: "192.168.0.56"
      metrics_port: 9100

    - name: srv-2-4
      type: fedora-vm
      role: server
      rack: rack-2
      vcpu: 1
      memory_mb: 768
      loopback: "10.0.5.4/32"
      mgmt_ip: "192.168.0.57"
      metrics_port: 9100

    # Rack 3
    - name: srv-3-1
      type: fedora-vm
      role: server
      rack: rack-3
      vcpu: 1
      memory_mb: 768
      loopback: "10.0.6.1/32"
      mgmt_ip: "192.168.0.58"
      metrics_port: 9100

    - name: srv-3-2
      type: fedora-vm
      role: server
      rack: rack-3
      vcpu: 1
      memory_mb: 768
      loopback: "10.0.6.2/32"
      mgmt_ip: "192.168.0.59"
      metrics_port: 9100

    - name: srv-3-3
      type: fedora-vm
      role: server
      rack: rack-3
      vcpu: 1
      memory_mb: 768
      loopback: "10.0.6.3/32"
      mgmt_ip: "192.168.0.60"
      metrics_port: 9100

    - name: srv-3-4
      type: fedora-vm
      role: server
      rack: rack-3
      vcpu: 1
      memory_mb: 768
      loopback: "10.0.6.4/32"
      mgmt_ip: "192.168.0.61"
      metrics_port: 9100

    # Rack 4
    - name: srv-4-1
      type: fedora-vm
      role: server
      rack: rack-4
      vcpu: 1
      memory_mb: 768
      loopback: "10.0.7.1/32"
      mgmt_ip: "192.168.0.62"
      metrics_port: 9100

    - name: srv-4-2
      type: fedora-vm
      role: server
      rack: rack-4
      vcpu: 1
      memory_mb: 768
      loopback: "10.0.7.2/32"
      mgmt_ip: "192.168.0.63"
      metrics_port: 9100

    - name: srv-4-3
      type: fedora-vm
      role: server
      rack: rack-4
      vcpu: 1
      memory_mb: 768
      loopback: "10.0.7.3/32"
      mgmt_ip: "192.168.0.64"
      metrics_port: 9100

    - name: srv-4-4
      type: fedora-vm
      role: server
      rack: rack-4
      vcpu: 1
      memory_mb: 768
      loopback: "10.0.7.4/32"
      mgmt_ip: "192.168.0.65"
      metrics_port: 9100

  # --- Infrastructure nodes ------------------------------------------------
  infrastructure:
    # Observability host: the real stack lives here (provision-obs.sh).
    # Boots first; every VM's baked-in resolv.conf points DNS at 192.168.0.4.
    - name: obs
      type: fedora-vm
      role: obs
      vcpu: 2
      memory_mb: 2048
      mgmt_ip: "192.168.0.4"
      metrics_port: 9100          # node_exporter
      services:
        - prometheus:  9090
        - grafana:     3000
        - loki:        3100
        - dnsmasq:     53         # serves DNS for netwatch.lab + upstream forward
        - chrony:      123        # NTP server (stratum 10)
      description: "Observability stack (Prometheus/Grafana/Loki), DNS (dnsmasq), NTP (chrony)"

    - name: bastion
      type: fedora-vm
      role: bastion
      vcpu: 1
      memory_mb: 384
      mgmt_ip: "192.168.0.2"
      metrics_port: 9100
      description: "SSH jump host and NAT gateway for fabric"

    # Reserved stub: base+client provisioning only, no services.
    - name: mgmt
      type: fedora-vm
      role: mgmt
      vcpu: 2
      memory_mb: 2048
      mgmt_ip: "192.168.0.3"
      metrics_port: 9100
      description: "RESERVED stub: no services; observability/DNS/NTP run on obs"

# ============================================================================
# FABRIC LINKS
# ============================================================================
# Every point-to-point link in the routed fabric.
# Each link maps to one Linux bridge with two veth endpoints.
#
# Convention:
#   - a_ip: higher-tier node (border > spine > leaf > server)
#   - b_ip: lower-tier node
#   - subnet: /30 allocation from the appropriate pool
#
# Total: 2 border-bastion + 4 border-spine + 16 spine-leaf + 32 leaf-server = 54 links
# BGP sessions: 4 border-spine + 16 spine-leaf = 20 sessions (border-bastion uses static routes)

links:

  # --- Border <-> Bastion (2 links) ----------------------------------------
  # North-south exit path. Static routes on borders, no BGP.
  # Bastion is a VM (NAT gateway), not an FRR container.
  border_bastion:
    - a: border-1
      b: bastion
      subnet: "172.16.0.0/30"
      a_ip: "172.16.0.1"
      b_ip: "172.16.0.2"

    - a: border-2
      b: bastion
      subnet: "172.16.0.4/30"
      a_ip: "172.16.0.5"
      b_ip: "172.16.0.6"

  # --- Border <-> Spine (4 links) ------------------------------------------
  border_spine:
    - a: border-1
      b: spine-1
      subnet: "172.16.1.0/30"
      a_ip: "172.16.1.1"
      b_ip: "172.16.1.2"

    - a: border-1
      b: spine-2
      subnet: "172.16.1.4/30"
      a_ip: "172.16.1.5"
      b_ip: "172.16.1.6"

    - a: border-2
      b: spine-1
      subnet: "172.16.1.8/30"
      a_ip: "172.16.1.9"
      b_ip: "172.16.1.10"

    - a: border-2
      b: spine-2
      subnet: "172.16.1.12/30"
      a_ip: "172.16.1.13"
      b_ip: "172.16.1.14"

  # --- Spine <-> Leaf (16 links) -------------------------------------------
  spine_leaf:
    # spine-1 to all 8 leafs
    - { a: spine-1, b: leaf-1a, subnet: "172.16.2.0/30",  a_ip: "172.16.2.1",  b_ip: "172.16.2.2"  }
    - { a: spine-1, b: leaf-1b, subnet: "172.16.2.4/30",  a_ip: "172.16.2.5",  b_ip: "172.16.2.6"  }
    - { a: spine-1, b: leaf-2a, subnet: "172.16.2.8/30",  a_ip: "172.16.2.9",  b_ip: "172.16.2.10" }
    - { a: spine-1, b: leaf-2b, subnet: "172.16.2.12/30", a_ip: "172.16.2.13", b_ip: "172.16.2.14" }
    - { a: spine-1, b: leaf-3a, subnet: "172.16.2.16/30", a_ip: "172.16.2.17", b_ip: "172.16.2.18" }
    - { a: spine-1, b: leaf-3b, subnet: "172.16.2.20/30", a_ip: "172.16.2.21", b_ip: "172.16.2.22" }
    - { a: spine-1, b: leaf-4a, subnet: "172.16.2.24/30", a_ip: "172.16.2.25", b_ip: "172.16.2.26" }
    - { a: spine-1, b: leaf-4b, subnet: "172.16.2.28/30", a_ip: "172.16.2.29", b_ip: "172.16.2.30" }

    # spine-2 to all 8 leafs
    - { a: spine-2, b: leaf-1a, subnet: "172.16.2.32/30", a_ip: "172.16.2.33", b_ip: "172.16.2.34" }
    - { a: spine-2, b: leaf-1b, subnet: "172.16.2.36/30", a_ip: "172.16.2.37", b_ip: "172.16.2.38" }
    - { a: spine-2, b: leaf-2a, subnet: "172.16.2.40/30", a_ip: "172.16.2.41", b_ip: "172.16.2.42" }
    - { a: spine-2, b: leaf-2b, subnet: "172.16.2.44/30", a_ip: "172.16.2.45", b_ip: "172.16.2.46" }
    - { a: spine-2, b: leaf-3a, subnet: "172.16.2.48/30", a_ip: "172.16.2.49", b_ip: "172.16.2.50" }
    - { a: spine-2, b: leaf-3b, subnet: "172.16.2.52/30", a_ip: "172.16.2.53", b_ip: "172.16.2.54" }
    - { a: spine-2, b: leaf-4a, subnet: "172.16.2.56/30", a_ip: "172.16.2.57", b_ip: "172.16.2.58" }
    - { a: spine-2, b: leaf-4b, subnet: "172.16.2.60/30", a_ip: "172.16.2.61", b_ip: "172.16.2.62" }

  # --- Leaf <-> Server (32 links) ------------------------------------------
  # Each server dual-homed: one link to leaf-Xa, one link to leaf-Xb.
  # Servers use ECMP default route via both leafs.
  # Leafs advertise connected /30 subnets into BGP.
  leaf_server:

    # Rack 1 (172.16.3.0/24)
    - { a: leaf-1a, b: srv-1-1, subnet: "172.16.3.0/30",  a_ip: "172.16.3.1",  b_ip: "172.16.3.2"  }
    - { a: leaf-1b, b: srv-1-1, subnet: "172.16.3.4/30",  a_ip: "172.16.3.5",  b_ip: "172.16.3.6"  }
    - { a: leaf-1a, b: srv-1-2, subnet: "172.16.3.8/30",  a_ip: "172.16.3.9",  b_ip: "172.16.3.10" }
    - { a: leaf-1b, b: srv-1-2, subnet: "172.16.3.12/30", a_ip: "172.16.3.13", b_ip: "172.16.3.14" }
    - { a: leaf-1a, b: srv-1-3, subnet: "172.16.3.16/30", a_ip: "172.16.3.17", b_ip: "172.16.3.18" }
    - { a: leaf-1b, b: srv-1-3, subnet: "172.16.3.20/30", a_ip: "172.16.3.21", b_ip: "172.16.3.22" }
    - { a: leaf-1a, b: srv-1-4, subnet: "172.16.3.24/30", a_ip: "172.16.3.25", b_ip: "172.16.3.26" }
    - { a: leaf-1b, b: srv-1-4, subnet: "172.16.3.28/30", a_ip: "172.16.3.29", b_ip: "172.16.3.30" }

    # Rack 2 (172.16.4.0/24)
    - { a: leaf-2a, b: srv-2-1, subnet: "172.16.4.0/30",  a_ip: "172.16.4.1",  b_ip: "172.16.4.2"  }
    - { a: leaf-2b, b: srv-2-1, subnet: "172.16.4.4/30",  a_ip: "172.16.4.5",  b_ip: "172.16.4.6"  }
    - { a: leaf-2a, b: srv-2-2, subnet: "172.16.4.8/30",  a_ip: "172.16.4.9",  b_ip: "172.16.4.10" }
    - { a: leaf-2b, b: srv-2-2, subnet: "172.16.4.12/30", a_ip: "172.16.4.13", b_ip: "172.16.4.14" }
    - { a: leaf-2a, b: srv-2-3, subnet: "172.16.4.16/30", a_ip: "172.16.4.17", b_ip: "172.16.4.18" }
    - { a: leaf-2b, b: srv-2-3, subnet: "172.16.4.20/30", a_ip: "172.16.4.21", b_ip: "172.16.4.22" }
    - { a: leaf-2a, b: srv-2-4, subnet: "172.16.4.24/30", a_ip: "172.16.4.25", b_ip: "172.16.4.26" }
    - { a: leaf-2b, b: srv-2-4, subnet: "172.16.4.28/30", a_ip: "172.16.4.29", b_ip: "172.16.4.30" }

    # Rack 3 (172.16.5.0/24)
    - { a: leaf-3a, b: srv-3-1, subnet: "172.16.5.0/30",  a_ip: "172.16.5.1",  b_ip: "172.16.5.2"  }
    - { a: leaf-3b, b: srv-3-1, subnet: "172.16.5.4/30",  a_ip: "172.16.5.5",  b_ip: "172.16.5.6"  }
    - { a: leaf-3a, b: srv-3-2, subnet: "172.16.5.8/30",  a_ip: "172.16.5.9",  b_ip: "172.16.5.10" }
    - { a: leaf-3b, b: srv-3-2, subnet: "172.16.5.12/30", a_ip: "172.16.5.13", b_ip: "172.16.5.14" }
    - { a: leaf-3a, b: srv-3-3, subnet: "172.16.5.16/30", a_ip: "172.16.5.17", b_ip: "172.16.5.18" }
    - { a: leaf-3b, b: srv-3-3, subnet: "172.16.5.20/30", a_ip: "172.16.5.21", b_ip: "172.16.5.22" }
    - { a: leaf-3a, b: srv-3-4, subnet: "172.16.5.24/30", a_ip: "172.16.5.25", b_ip: "172.16.5.26" }
    - { a: leaf-3b, b: srv-3-4, subnet: "172.16.5.28/30", a_ip: "172.16.5.29", b_ip: "172.16.5.30" }

    # Rack 4 (172.16.6.0/24)
    - { a: leaf-4a, b: srv-4-1, subnet: "172.16.6.0/30",  a_ip: "172.16.6.1",  b_ip: "172.16.6.2"  }
    - { a: leaf-4b, b: srv-4-1, subnet: "172.16.6.4/30",  a_ip: "172.16.6.5",  b_ip: "172.16.6.6"  }
    - { a: leaf-4a, b: srv-4-2, subnet: "172.16.6.8/30",  a_ip: "172.16.6.9",  b_ip: "172.16.6.10" }
    - { a: leaf-4b, b: srv-4-2, subnet: "172.16.6.12/30", a_ip: "172.16.6.13", b_ip: "172.16.6.14" }
    - { a: leaf-4a, b: srv-4-3, subnet: "172.16.6.16/30", a_ip: "172.16.6.17", b_ip: "172.16.6.18" }
    - { a: leaf-4b, b: srv-4-3, subnet: "172.16.6.20/30", a_ip: "172.16.6.21", b_ip: "172.16.6.22" }
    - { a: leaf-4a, b: srv-4-4, subnet: "172.16.6.24/30", a_ip: "172.16.6.25", b_ip: "172.16.6.26" }
    - { a: leaf-4b, b: srv-4-4, subnet: "172.16.6.28/30", a_ip: "172.16.6.29", b_ip: "172.16.6.30" }

# ============================================================================
# MANAGEMENT NETWORK
# ============================================================================
# Single libvirt network (netwatch-mgmt, bridge virbr2) for OOB access across
# the 31-node lab (30 nodes on the OOB net; bastion also carries it).
# Isolated from the routed fabric. DHCP by libvirt; DNS (netwatch.lab) by obs.

management:
  bridge: virbr2
  cidr: "192.168.0.0/24"
  gateway: "192.168.0.1"        # host interface on the netwatch-mgmt libvirt network
  dhcp_server: libvirt          # mgmt-net DHCP handled by the libvirt 'netwatch-mgmt' network
  dns_server: obs               # DNS (netwatch.lab) served by dnsmasq on obs (192.168.0.4)
  dns_domain: "netwatch.lab"

# ============================================================================
# OBSERVABILITY
# ============================================================================

observability:
  prometheus:
    host: obs
    port: 9090
    scrape_interval_s: 15
    targets:
      frr_nodes:
        port: 9342              # frr_exporter
        nodes:
          - border-1
          - border-2
          - spine-1
          - spine-2
          - leaf-1a
          - leaf-1b
          - leaf-2a
          - leaf-2b
          - leaf-3a
          - leaf-3b
          - leaf-4a
          - leaf-4b
      vm_nodes:
        port: 9100              # node_exporter
        nodes:
          - srv-1-1
          - srv-1-2
          - srv-1-3
          - srv-1-4
          - srv-2-1
          - srv-2-2
          - srv-2-3
          - srv-2-4
          - srv-3-1
          - srv-3-2
          - srv-3-3
          - srv-3-4
          - srv-4-1
          - srv-4-2
          - srv-4-3
          - srv-4-4
          - bastion
          - obs
          - mgmt

  grafana:
    host: obs
    port: 3000
    dashboards:
      - noc-overview
      - fabric-routing
      - evpn-vxlan
      - hosts-interfaces

  loki:
    host: obs
    port: 3100
    description: "rsyslog from all nodes -> Loki -> Grafana LogQL"

# ============================================================================
# EVPN / VXLAN (OVERLAY)
# ============================================================================
# Leafs are VTEPs. MP-BGP L2VPN address family on top of the routed underlay.

evpn:
  enabled: true
  # VNIs are explicit per-tenant (tenants[].l2vni) and the symmetric IRB l3vni.
  vtep_nodes:                            # all 8 leaves are VTEPs
    - leaf-1a
    - leaf-1b
    - leaf-2a
    - leaf-2b
    - leaf-3a
    - leaf-3b
    - leaf-4a
    - leaf-4b

  # --- Symmetric IRB / L3VNI (distributed anycast gateway) -----------------
  # Tenant routing VRF + transit L3VNI. Instantiated on ALL 8 leaves so the
  # anycast gateway is distributed. RT/RD are explicit (ASN-independent)
  # because each rack is a distinct ASN (65101-65104); auto-RT would not match.
  l3vni: 10999                           # symmetric IRB transit VNI
  l3vni_vrf: Tenant-A                    # tenant VRF name
  l3vni_vlan: 999                        # SVI VLAN for the L3VNI bridge
  l3vni_table: 1099                      # kernel VRF route-table id
  l3vni_rt: "65000:10999"                # explicit import/export RT for L3VNI
  anycast_gw_mac: "00:00:5e:00:01:99"    # identical on every leaf (IANA VRRP-style)
  overlay_supernet: "10.99.0.0/16"       # single CONNECTED-FILTER deny covers all tenant /24s
  vxlan_dstport: 4789                    # standard VXLAN UDP port

  # --- Tenants (VNI-per-tenant L2 segments over VXLAN) ---------------------
  # Real servers attach a dedicated overlay access NIC (tnt0/tnt1) single-homed
  # to leaf-Xa. Access is added OUTSIDE node[].interfaces (separate generator
  # context lists) and NOT via top-level links:, so the 54-link /30 underlay
  # registry and the len(interfaces)==2 server guard are untouched.
  tenants:
    - name: tenant-a
      l2vni: 10000                       # vxlan10000 / br-vni10000
      access_vlan: 99
      subnet: "10.99.0.0/24"
      anycast_gw: "10.99.0.1/24"         # identical on all 8 leaves
      svi: svi-vni10000
      rt: "65000:10000"                  # explicit; identical on all leaves
      members:
        - { server: srv-1-1, leaf: leaf-1a, overlay_ip: "10.99.0.11/24", mac: "02:4E:57:07:01:01", nic: tnt0 }
        - { server: srv-2-1, leaf: leaf-2a, overlay_ip: "10.99.0.21/24", mac: "02:4E:57:07:05:01", nic: tnt0 }
        - { server: srv-3-1, leaf: leaf-3a, overlay_ip: "10.99.0.31/24", mac: "02:4E:57:07:09:01", nic: tnt0 }
        - { server: srv-4-1, leaf: leaf-4a, overlay_ip: "10.99.0.41/24", mac: "02:4E:57:07:0D:01", nic: tnt0 }
    - name: tenant-b
      l2vni: 10001                       # vxlan10001 / br-vni10001
      access_vlan: 98
      subnet: "10.99.1.0/24"
      anycast_gw: "10.99.1.1/24"
      svi: svi-vni10001
      rt: "65000:10001"
      members:
        - { server: srv-4-1, leaf: leaf-4a, overlay_ip: "10.99.1.41/24", mac: "02:4E:57:07:0D:02", nic: tnt1 }

  description: >
    VNI-per-tenant L2 overlay over VXLAN (real servers) + distributed anycast
    IRB + symmetric L3VNI 10999, layered on the routed /30 ECMP underlay
    without touching it. Leaf VTEPs. Consumed by generate.py to render leaf FRR
    VRF/L3VNI/anycast SVIs, per-VNI RD/RT, overlay host bridges, and the
    leaf/server overlay access NICs.

